apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-calculator
  namespace: budget-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budget-calculator
  template:
    metadata:
      labels:
        app: budget-calculator
    spec:
      containers:
      - name: budget-calculator
        image: budget-calculator:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20 